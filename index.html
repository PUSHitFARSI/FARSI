<style>
:root{
  --bg:#F5F5F3; --surface:#FFFFFF; --surface-2:#F9F9F7; --ink:#17191E; --muted:#6C7079; --faint:#A4A7AE;
  --line:#E5E5E0; --soft:#EEEEEA; --accent:#27467F; --accent-soft:#E9EDF5; --on-accent:#FFFFFF;
  --good:#2E6B50; --good-soft:#E6F0EA; --bad:#A6423D; --bad-soft:#F6E8E6;
  --fa-scale:1; color-scheme:light;
  --ui:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fa:"Vazirmatn",Tahoma,"Noto Naskh Arabic","Geeza Pro",sans-serif;
  --naskh:"Noto Naskh Arabic","Vazirmatn","Geeza Pro",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --surface:#1A1D22; --surface-2:#1F2329; --ink:#ECEDEF; --muted:#9CA0A8; --faint:#6A6F77;
    --line:#2A2E35; --soft:#252A31; --accent:#A3B9E8; --accent-soft:#232C3D; --on-accent:#121417;
    --good:#86C7A5; --good-soft:#1C3127; --bad:#E8918B; --bad-soft:#3A2523; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1A1D22; --surface-2:#1F2329; --ink:#ECEDEF; --muted:#9CA0A8; --faint:#6A6F77;
  --line:#2A2E35; --soft:#252A31; --accent:#A3B9E8; --accent-soft:#232C3D; --on-accent:#121417;
  --good:#86C7A5; --good-soft:#1C3127; --bad:#E8918B; --bad-soft:#3A2523; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html.lock{overflow:hidden}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55;font-weight:400}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fa{font-family:var(--fa);direction:rtl;unicode-bidi:isolate}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.wrap{max-width:600px;margin:0 auto;padding:22px 20px 120px}
h1{font-size:1.6rem;font-weight:600;margin:8px 0 4px;letter-spacing:-.02em}
h2{font-size:1rem;font-weight:600;margin:34px 0 12px;letter-spacing:-.005em}
.sub{margin:0;color:var(--muted);font-size:.92rem}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 16px;border-radius:14px;
  border:1px solid var(--line);background:var(--surface);font-weight:500;text-align:center;transition:background .15s,border-color .15s}
.btn:active{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--accent);min-height:40px;padding:8px 10px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.full{width:100%}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn{flex:1}
.r0,.r1{color:var(--ink)}
.r2{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--line)}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--muted)}
.icon-btn svg{width:20px;height:20px}

/* ---------- today ---------- */
.hero{padding:6px 0 2px}
.hero .date{font-size:clamp(1.8rem,8vw,2.45rem);font-weight:700;color:var(--ink);line-height:1.4;text-align:right;margin:0}
.hero .greet{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:2px;color:var(--muted)}
.hero .greet .fa{font-size:1.1rem;font-weight:500;color:var(--accent)}
.hero .greet .muted{font-size:.86rem}
.stats3{display:grid;grid-template-columns:auto 1fr 1fr;align-items:center;margin-top:22px;
  background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 18px}
.stats3 > *:not(:first-child){padding-left:16px;border-left:1px solid var(--line);margin-left:16px}
.ringbox{position:relative;width:72px;height:72px}
.ringbox svg{transform:rotate(-90deg)}
.ringbox .ring-bg{stroke:var(--soft)}
.ringbox .ring-fg{stroke:var(--accent);transition:stroke-dashoffset .6s}
.ringbox .ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.68rem;color:var(--muted);line-height:1.15}
.ringbox .ring-txt b{font-size:1.1rem;color:var(--ink);font-weight:600}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:1.3rem;font-weight:600;display:flex;align-items:center;gap:6px}
.stat span{font-size:.78rem;color:var(--muted)}
.star{width:18px;height:18px;flex:none}
.star rect{fill:var(--accent)}
.lvl-fa{font-family:var(--fa);font-weight:600;color:var(--ink)}

/* ---------- list rows ---------- */
.list{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:14px 16px;width:100%;
  border:0;border-top:1px solid var(--line);background:transparent;text-align:left;min-height:66px}
.row:first-child{border-top:0}
.row:active{background:var(--surface-2)}
.tag{width:52px;height:44px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;
  font-family:var(--fa);font-weight:600;font-size:.92rem;color:var(--ink)}
.row.done .tag{background:var(--accent-soft);color:var(--accent)}
.row .t1,.row .t2{display:block}
.row .t1{font-weight:500;line-height:1.35}
.row .t2{font-size:.84rem;color:var(--muted);line-height:1.4;margin-top:2px}
.row .go{color:var(--faint);font-size:.84rem;white-space:nowrap}
.row.done .go{color:var(--accent);font-weight:500}
.row.done .t1{color:var(--muted)}

/* ---------- literary cards (poem, proverb) ---------- */
.lit{margin-top:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px 20px 20px;width:100%;text-align:center;display:block}
.lit .verse{font-family:var(--naskh);direction:rtl;font-size:calc(1.42rem*var(--fa-scale));line-height:2.05;font-weight:500;color:var(--ink)}
.lit .verse .hm{display:block}
.lit .verse .cp + .cp{margin-top:14px}
.lit .by{margin-top:14px;font-size:.84rem;color:var(--muted);display:flex;justify-content:center;gap:8px;align-items:baseline}
.lit .by .fa{color:var(--ink);font-weight:500}
.lit .reveal{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);text-align:left;font-size:.92rem;line-height:1.55}
.lit .reveal .fl{color:var(--muted);display:block}
.lit .reveal .tl{display:block;margin-top:8px}
.lit .reveal .nt{display:block;margin-top:8px;color:var(--muted);font-size:.84rem}
.lit .hint{margin-top:12px;font-size:.84rem;color:var(--faint)}
.lit.prov .verse{font-size:calc(1.3rem*var(--fa-scale))}
.cpgap{display:block;height:8px}
.more-link{display:block;width:100%;margin-top:10px;background:none;border:0;color:var(--accent);font-weight:500;font-size:.9rem;padding:8px;min-height:40px}

/* ---------- stats ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px}
.panel + .panel{margin-top:12px}
.seg-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--soft);margin:12px 0 10px}
.seg-bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.c-master{background:var(--accent)}
.c-known{background:var(--accent);opacity:.55}
.c-learn{background:var(--accent);opacity:.22}
.c-new{background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.legend i.c-known,.legend i.c-learn{opacity:1}
.legend i.c-known{background:color-mix(in srgb,var(--accent) 55%,var(--surface))}
.legend i.c-learn{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin-top:12px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--soft);display:block;position:relative}
.heat i.h1,.heat i.h2,.heat i.h3{background:var(--accent)}
.heat i.h1{opacity:.3}.heat i.h2{opacity:.6}
.heat i.today{box-shadow:0 0 0 1.5px var(--ink)}
.spark{width:100%;height:64px;display:block;margin-top:10px}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.kv > span{color:var(--muted);font-size:.9rem}
.kv b{font-size:1.15rem;font-weight:600}
.bar{height:5px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

/* ---------- words ---------- */
.search{width:100%;margin-top:16px;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.big-cta{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;width:100%;margin-top:16px;padding:18px 20px;border-radius:20px;
  border:0;background:var(--accent);color:var(--on-accent);text-align:left}
.big-cta .n{font-size:2rem;font-weight:600;line-height:1;display:block}
.big-cta .l{font-size:.9rem;opacity:.85;display:block;margin-top:4px}
.big-cta[disabled]{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.lvl-h{display:flex;justify-content:space-between;align-items:baseline;margin:34px 0 4px;gap:10px}
.lvl-h h2{margin:0}
.lvl-h .muted{font-size:.8rem;text-align:right}
.deck{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:15px 16px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.deck:first-child{border-top:0}
.deck .dn{font-weight:500}
.deck .dn .fa{font-size:.95rem;color:var(--muted);font-weight:400;margin-left:8px}
.deck .bar{grid-column:1/-1;margin-top:8px}
.deck .cnt{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.newpill{margin-left:8px;font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;vertical-align:2px;font-weight:500}
.deck.cur .dn::after{content:"Current";margin-left:8px;font-size:.7rem;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:1px 8px;vertical-align:2px}
.wlist .wrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.wlist .wrow:first-child{border-top:0}
.wlist .wfa{font-size:calc(1.22rem*var(--fa-scale));font-weight:600;min-width:4.5rem;text-align:right}
.wlist .wfin{color:var(--muted);font-size:.88rem}
.wlist .wen{font-size:.88rem}
.dot{width:9px;height:9px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1.5px var(--faint)}
.dot.s1{background:color-mix(in srgb,var(--accent) 25%,var(--surface));box-shadow:none}
.dot.s3{background:color-mix(in srgb,var(--accent) 60%,var(--surface));box-shadow:none}
.dot.s5{background:var(--accent);box-shadow:none}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);display:none}
.sheet.on{display:block}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 14px 8px;max-width:640px;margin:0 auto}
.sheet-head .title{flex:1;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.15rem;line-height:1;flex:none;color:var(--muted)}
.sheet-body{max-width:600px;margin:0 auto;padding:6px 20px 48px}
.progress{height:4px;background:var(--soft);border-radius:2px;overflow:hidden;margin:2px 0 18px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px 20px 22px;text-align:center;min-height:300px;
  display:flex;flex-direction:column;justify-content:center;gap:4px}
.kind{font-size:.78rem;color:var(--faint);margin-bottom:8px;letter-spacing:.01em}
.bigfa{font-family:var(--fa);direction:rtl;font-weight:700;color:var(--ink);
  font-size:calc(clamp(2.5rem,12vw,3.6rem)*var(--fa-scale));line-height:1.4;margin:0;word-break:break-word}
.fin{color:var(--muted);font-size:1.2rem;font-weight:400;min-height:1.9rem}
.en{font-size:1.1rem;min-height:1.7rem;font-weight:500}
.prompt-en{font-size:1.4rem;font-weight:600;line-height:1.3;display:block}
.parts{margin-top:12px;font-size:.9rem;color:var(--muted)}
.parts .fa{color:var(--ink);font-weight:600}
.example{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);text-align:right}
.example .fa{font-size:calc(1.05rem*var(--fa-scale));line-height:1.95;display:block}
.example .muted{text-align:left;display:block;font-size:.84rem}
.example b{color:var(--accent);font-weight:700}
.hide{visibility:hidden}
.speak{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.84rem;margin:10px auto 0;display:inline-flex;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opts .opt{min-height:74px;border-radius:18px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--fa);font-size:calc(1.6rem*var(--fa-scale));font-weight:600;padding:10px;transition:background .15s,border-color .15s,color .15s}
.opts.en-opts{grid-template-columns:1fr}
.opts.en-opts .opt{font-family:var(--ui);font-size:1rem;font-weight:400;min-height:56px;text-align:left;padding:13px 16px}
.opts.en-opts .opt b{font-weight:600}
.opt.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.4}
.fb{margin-top:14px;font-size:.94rem;min-height:1.5rem;text-align:left;line-height:1.55}
.fb.good{color:var(--good)}.fb.badc{color:var(--bad)}
.slot{min-height:84px;margin-top:14px;border-radius:18px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;
  font-family:var(--fa);direction:rtl;font-size:calc(2.1rem*var(--fa-scale));font-weight:700;color:var(--ink);padding:6px 10px;background:var(--surface)}
.slot.ok{border-style:solid;border-color:var(--good);color:var(--good)}
.slot.bad{border-style:solid;border-color:var(--bad);color:var(--bad)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;direction:rtl}
.tile{width:52px;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-family:var(--fa);font-size:1.65rem;font-weight:600}
.tile.used{opacity:.2}
.summary{text-align:center;padding:34px 10px}
.summary .bigfa{color:var(--accent)}
.summary .big-n{font-size:2.5rem;font-weight:600;margin:18px 0 4px;letter-spacing:-.02em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.88rem;min-height:40px;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .fa{font-weight:600}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:1.05rem;color:var(--ink)}
.hsent{font-family:var(--fa);direction:rtl;font-size:calc(1.55rem*var(--fa-scale));line-height:2;text-align:right}
.hsent mark{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:0 5px;font-weight:700}
.hsent.naskh{font-family:var(--naskh);text-align:center;font-weight:500}

/* ---------- reader ---------- */
.rmeta{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin:0 0 16px;color:var(--faint);font-size:.84rem}
.rtitle{font-family:var(--fa);direction:rtl;text-align:right;font-weight:700;font-size:calc(1.85rem*var(--fa-scale));color:var(--ink);margin:6px 0 2px;line-height:1.45}
.rtext{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px 18px;position:relative}
.rtext .sent{font-family:var(--fa);direction:rtl;text-align:right;font-size:calc(1.4rem*var(--fa-scale));line-height:2.2;margin:0 0 6px}
.rtext.poem .sent{font-family:var(--naskh);text-align:center;margin-bottom:18px;font-weight:500}
.rtext.poem .sent span.hm{display:block}
.rtext .num{font-family:var(--ui);font-size:.72rem;color:var(--faint);margin-left:8px;vertical-align:4px}
.tok{display:inline;border:0;background:none;padding:0 2px;border-radius:6px;font:inherit;color:inherit;line-height:inherit}
.tg{white-space:nowrap}
.tok.sel{background:var(--accent-soft);color:var(--accent)}
.tok.unk{cursor:default}
.rtext.locked{min-height:240px}
.locked .sent{filter:blur(7px);user-select:none;pointer-events:none;opacity:.6}
.lockmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
.tr{direction:ltr;text-align:left;font-family:var(--ui);font-size:.88rem;line-height:1.5;margin:-2px 0 16px;padding-left:12px;border-left:2px solid var(--line)}
.tr .tf{color:var(--muted)}
.tr .te{color:var(--ink)}
.src{font-size:.82rem;color:var(--muted);margin-top:12px}
.result{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.result .panel{text-align:center;padding:14px}
.result b{font-size:1.6rem;font-weight:600;display:block}
.qbox{margin-top:20px}
.qbox h3{font-size:.98rem;margin:18px 0 8px;font-weight:600}
.glossbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);border-radius:22px 22px 0 0;
  box-shadow:0 -10px 30px rgba(10,15,25,.10);padding:18px 20px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .22s ease}
.glossbar.on{transform:none}
.glossbar .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.glossbar .gfa{font-family:var(--fa);direction:rtl;text-align:left;font-size:calc(1.65rem*var(--fa-scale));font-weight:700;color:var(--ink);grid-column:1}
.glossbar .gfin{color:var(--muted)}
.glossbar .gen{font-size:1rem;font-weight:500}
.glossbar .gact{grid-column:2;grid-row:1/4;display:flex;flex-direction:column;gap:8px}
.lib .row .tag{font-size:.8rem;font-family:var(--ui);font-weight:500}
.lib .row .t2 .fa{font-weight:500;font-size:1rem;margin-right:8px;color:var(--ink)}

/* ---------- drills ---------- */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.dcard{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:156px}
.dcard .dfa{font-family:var(--fa);direction:rtl;font-size:1.45rem;font-weight:600;color:var(--accent);text-align:right;line-height:1.35}
.dcard .dt{font-weight:600}
.dcard .dd{font-size:.82rem;color:var(--muted);line-height:1.4;flex:1}
.dcard .db{font-size:.78rem;color:var(--faint)}

/* ---------- more ---------- */
.setrow{padding:14px 16px;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow .sl{font-weight:500;margin-bottom:10px;font-size:.95rem}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;min-height:38px;font-size:.88rem;color:var(--muted)}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.10);font-weight:600;color:var(--ink)}
.code{width:100%;min-height:96px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:.78rem ui-monospace,Menlo,Consolas,monospace;padding:10px;word-break:break-all;resize:vertical}
.guide h2{font-size:1rem}
.guide h3{font-size:.98rem;margin:0 0 8px;font-weight:600}
.guide p{margin:0 0 8px;font-size:.92rem;line-height:1.6}
.guide .letters{font-family:var(--fa);font-size:1.5rem;font-weight:600;color:var(--accent);letter-spacing:.2em}
.pitem{display:grid;grid-template-columns:4.6rem 1fr;gap:4px 14px;align-items:start;padding:15px 16px;border-top:1px solid var(--line)}
.pitem:first-child{border-top:0}
.pitem .fa.af{font-size:1.45rem;font-weight:600;color:var(--accent);text-align:center;grid-row:span 2}
.pitem .ex{font-size:.88rem;color:var(--muted);line-height:1.7}
.pitem .ex .fa{color:var(--ink);font-weight:600;font-size:1rem}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:.88rem;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.savestate{font-size:.78rem;color:var(--faint);margin-top:16px;text-align:center}
.savestate.warn{color:var(--bad)}

/* ---------- typing ---------- */
.tcard{min-height:0;padding:22px 18px 18px}
.tgt{min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tletter{font-size:calc(4rem*var(--fa-scale));font-weight:700;color:var(--ink);line-height:1.2}
.tline{font-size:calc(1.45rem*var(--fa-scale));line-height:2.05;text-align:center;display:block}
.tw{border-radius:6px;padding:0 2px;color:var(--faint)}
.tw-ok{color:var(--ink)}
.tw-bad{color:var(--bad);text-decoration:underline wavy;text-underline-offset:6px}
.tw-cur,.tw-next{color:var(--accent);text-decoration:underline;text-underline-offset:9px;text-decoration-thickness:2px}
.tsub{font-size:.9rem;color:var(--muted);margin-top:6px}
.tin{width:100%;margin-top:12px;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  font-family:var(--fa);font-size:calc(1.45rem*var(--fa-scale));text-align:right;outline:none;transition:border-color .15s}
.tin:focus{border-color:var(--accent)}
.tin:focus-visible{outline:none}
.tin.bad{border-color:var(--bad)}
.tin.ok{border-color:var(--good)}
.tstats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;text-align:center}
.tstats > div + div{border-left:1px solid var(--line)}
.tstats b{display:block;font-size:1.2rem;font-weight:600;font-variant-numeric:tabular-nums}
.tstats span{font-size:.74rem;color:var(--muted)}
.tmsg{min-height:1.3rem;color:var(--bad);font-size:.86rem;margin:8px 0 0;text-align:center}

/* ---------- roots, proverbs, poems lists ---------- */
.rootline{margin-top:14px;font-size:.86rem;color:var(--muted);text-align:left;line-height:1.65}
.rootline .fa{color:var(--ink);font-weight:600}
.rootline .root,.af.root{letter-spacing:.25em;color:var(--accent)}
.molds{display:grid;gap:6px;margin:6px 0 4px}
.mold{display:grid;grid-template-columns:8.5rem 1fr;gap:10px;align-items:baseline;font-size:.86rem;padding:9px 12px;background:var(--surface-2);border-radius:12px;border:1px solid var(--line)}
.mold .fa{font-size:1rem;font-weight:600;text-align:right}
.pvrow{grid-template-columns:1fr!important;padding:18px 16px!important}
.pvrow > span{display:flex;flex-direction:column;gap:3px}
.pvfa{font-family:var(--naskh);font-size:calc(1.22rem*var(--fa-scale));font-weight:500;line-height:1.95;text-align:right;display:block}
.pvrow .t2.fl{color:var(--muted)}
.poemrow{padding:22px 16px!important}
.poemrow .pvfa{text-align:center;font-size:calc(1.25rem*var(--fa-scale))}
.poemrow .pvfa .hm{display:block}
.poemrow .pvfa .cp + .cp{margin-top:10px}
.poemrow .by{text-align:center;font-size:.8rem;color:var(--muted);margin-top:6px}
.poemrow .ln{display:block;font-size:.88rem;line-height:1.5}
.poemrow .lnf{color:var(--muted)}

/* ---------- nav ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{display:flex;max-width:600px;margin:0 auto}
nav.tabs button{flex:1;border:0;background:none;color:var(--faint);font-size:.7rem;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:0;min-height:58px}
nav.tabs button .fa{font-size:1rem;font-weight:600;line-height:1.5}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on .fa{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:520px){.dgrid{grid-template-columns:1fr 1fr 1fr}}

// ---- core.js ----
// ---------- Core text processing (shared by app and build checks) ----------
const ZW = "\u200c";
function Z(x){ // convert | to half-space in all strings, deeply
  if (typeof x === "string") return x.replace(/\|/g, ZW);
  if (Array.isArray(x)) return x.map(Z);
  if (x && typeof x === "object") { const o = {}; for (const k in x) o[Z(k)] = Z(x[k]); return o; }
  return x;
}
const NORM = s => String(s).replace(/[\u064B-\u0652\u0670~]/g, "").replace(/\u200c/g, "")
  .replace(/ي/g, "ی").replace(/ك/g, "ک").replace(/\s+/g, " ").trim();
const PUNCT_RE = /^([«»"'()\[\]،؛:.!?؟…]*)(.*?)([«»"'()\[\]،؛:.!?؟…]*)$/;
const ezFin = f => f + (/[aeiou]$/i.test(f) ? "-ye" : "-e");

function buildLexicon(decks, lex) {
  const LX = new Map(), WORD = {};
  for (const [fa, fin, en] of lex) LX.set(NORM(fa), { fa, fin, en });
  for (const d of decks) for (const w of d.w) {
    WORD[w.fa] = w;
    const k = NORM(w.fa);
    if (!LX.has(k)) LX.set(k, { fa: w.fa, fin: w.fin, en: w.en, word: true });
    else LX.get(k).word = true;
  }
  return { LX, WORD };
}

function lookupWord(LX, w, ov) {
  const k = NORM(w);
  if (ov && ov[k]) return ov[k];
  const e = LX.get(k);
  if (e) return e;
  const m = w.replace(/~$/, "").match(/^(.+)\u200cی$/); // written ezafe after a half-space
  if (m) { const b = LX.get(NORM(m[1])); if (b) return { fa: b.fa, fin: ezFin(b.fin), en: b.en, base: b }; }
  return null;
}

// Split a sentence into tokens; groups multi-word expressions found in the lexicon.
function tokenize(LX, sentence, ov) {
  const raw = sentence.split(/\s+/).filter(Boolean).map(r => {
    const m = r.match(PUNCT_RE); return { pre: m[1], w: m[2], post: m[3] };
  });
  const res = [];
  for (let i = 0; i < raw.length;) {
    let hit = null;
    for (let n = 4; n >= 2 && !hit; n--) {
      if (i + n > raw.length) continue;
      let ok = true;
      for (let j = i; j < i + n; j++) {
        if (!raw[j].w) ok = false;
        if (j > i && raw[j].pre) ok = false;
        if (j < i + n - 1 && raw[j].post) ok = false;
      }
      if (!ok) continue;
      const key = raw.slice(i, i + n).map(o => NORM(o.w)).join(" ");
      const e = (ov && ov[key]) || LX.get(key);
      if (e) hit = { n, e };
    }
    if (hit) {
      const last = raw[i + hit.n - 1];
      res.push({ pre: raw[i].pre, post: last.post, words: raw.slice(i, i + hit.n).map(o => o.w), e: hit.e, ez: /~$/.test(last.w) });
      i += hit.n;
    } else {
      const o = raw[i];
      res.push({ pre: o.pre, post: o.post, words: o.w ? [o.w] : [], e: o.w ? lookupWord(LX, o.w, ov) : null, ez: /~$/.test(o.w) });
      i++;
    }
  }
  return res;
}
const tokFin = t => t.e ? (t.ez ? ezFin(t.e.fin) : t.e.fin) : "?";
if (typeof module !== "undefined") module.exports = { Z, NORM, tokenize, buildLexicon, lookupWord, ezFin, tokFin, ZW };

["دولت قانون~ جدیدی برای حفظ~ محیط~ زیست تصویب کرد.","The government passed a new law to protect the environment."],
["همدلی یعنی احساس~ دیگران را درک کنیم.","Empathy means understanding other people's feelings."]
]},

{id:"t1", lvl:2, fa:"خانواده|ی من", en:"My family", s:[
["من در آلمان به دنیا آمدم، اما پدر و مادرم اهل~ شیراز هستند.","I was born in Germany, but my parents are from Shiraz."],
["در خانه|ی ما همه فارسی حرف می|زنند، ولی من و برادرم با هم آلمانی صحبت می|کنیم.","At home everyone speaks Persian, but my brother and I speak German with each other."],
["مادربزرگم هر هفته از ایران زنگ می|زند و حال~ همه را می|پرسد.","My grandmother calls from Iran every week and asks how everyone is doing."],
["او همیشه می|گوید که فارسی|ام خیلی بهتر شده است.","She always says my Persian has gotten much better."],
["تابستان~ آینده می|خواهم با خانواده|ام به دیدن~ او بروم.","Next summer I want to go and visit her with my family."]
], q:[
["Where are the narrator's parents from?","Shiraz","Tehran","Berlin"],
["Which language does the narrator speak with their brother?","German","Persian","English"]
]},
{id:"t2", lvl:2, fa:"یک روز پاییزی", en:"An autumn day", s:[
["امروز هوا سرد و ابری بود و از صبح باران می|بارید.","Today it was cold and cloudy, and it had been raining since morning."],
["بعد از کار با دوستم در یک کافه|ی کوچک قرار گذاشتیم.","After work I met up with a friend at a small café."],
["دوستم چای~ سبز سفارش داد و من یک قهوه|ی داغ خوردم.","My friend ordered green tea and I had a hot coffee."],
["درباره|ی کار، خانواده و برنامه|های تعطیلات حرف زدیم.","We talked about work, family and plans for the holidays."],
["وقتی بیرون آمدیم، هوا تاریک شده بود و چراغ|های شهر روشن بودند.","When we came out it had gotten dark, and the city lights were on."]
], q:[
["What was the weather like?","Cold and rainy","Sunny and warm","Snowy"],
["What did they talk about?","Work, family and holiday plans","Movies and books","Sports"]
]},
{id:"t3", lvl:2, fa:"شب یلدا", en:"Yalda night", s:[
["شب~ یلدا طولانی|ترین شب~ سال است.","Yalda night is the longest night of the year."],
["ایرانی|ها در این شب کنار~ هم جمع می|شوند و تا دیروقت بیدار می|مانند.","On this night Iranians gather together and stay up late."],
["روی~ سفره معمولاً انار، هندوانه، آجیل و شیرینی می|گذارند.","They usually put pomegranates, watermelon, nuts and sweets on the spread."],
["بزرگ|ترها قصه تعریف می|کنند و بعضی خانواده|ها فال~ حافظ می|گیرند.","The elders tell stories, and some families read a Hafez fortune."],
["این جشن بیش از هزار سال قدمت دارد.","This celebration is more than a thousand years old."]
], q:[
["What is special about Yalda night?","It's the longest night of the year","It's the first day of spring","It's the shortest night of the year"],
["Which fruits are mentioned?","Pomegranates and watermelon","Apples and grapes","Oranges and figs"]
]},
{id:"t4", lvl:2, fa:"نوروز", en:"Nowruz", s:[
["نوروز، جشن~ سال~ نو~ ایرانی، با آغاز~ بهار شروع می|شود.","Nowruz, the Iranian New Year, begins on the first day of spring."],
["چند هفته قبل از عید، مردم خانه|تکانی می|کنند.","A few weeks before the holiday, people give their homes a big spring cleaning."],
["سفره|ی هفت|سین هفت چیز دارد که نام~ همه|ی آن|ها با «س» شروع می|شود، مثل~ سیب، سبزه و سکه.","The haft-sin table has seven things whose names all start with \"s\", like apple, sprouts and coin."],
["در روزهای عید به دیدن~ فامیل می|رویم و بزرگ|ترها به بچه|ها عیدی می|دهند.","During the holidays we visit relatives, and the elders give the children New Year's money."],
["روز~ سیزدهم، همه برای سیزده|بدر به طبیعت می|روند.","On the thirteenth day, everyone heads out into nature for Sizdah Bedar."]
], q:[
["When does Nowruz begin?","On the first day of spring","In the middle of winter","At the end of summer"],
["What do the haft-sin items have in common?","Their names start with \"s\"","They are all fruits","They are all green"]
]},
{id:"t5", lvl:2, fa:"قرمه|سبزی", en:"Ghormeh sabzi", s:[
["قرمه|سبزی یکی از محبوب|ترین غذاهای ایرانی است.","Ghormeh sabzi is one of the most popular Iranian dishes."],
["برای پختن~ آن به گوشت، لوبیا قرمز، لیمو عمانی و مقدار~ زیادی سبزی نیاز داریم.","To make it, we need meat, kidney beans, dried limes and a lot of herbs."],
["سبزی|ها را خرد می|کنیم و در روغن سرخ می|کنیم تا رنگشان تیره شود.","We chop the herbs and fry them in oil until they turn dark."],
["بعد همه|ی مواد را با آب در قابلمه می|ریزیم و چند ساعت روی~ حرارت~ کم می|پزیم.","Then we put all the ingredients in a pot with water and cook it for a few hours on low heat."],
["قرمه|سبزی را معمولاً با برنج~ سفید و ته|دیگ می|خورند.","Ghormeh sabzi is usually eaten with white rice and tahdig."]
], q:[
["Which ingredient is used in large amounts?","Herbs","Potatoes","Yogurt"],
["How long does it cook?","A few hours","Ten minutes","Overnight in the oven"]
]},
{id:"t6", lvl:2, fa:"دیدار با مادربزرگ", en:"Visiting grandma", s:[
["پارسال تابستان بعد از پنج سال به ایران سفر کردم.","Last summer I traveled to Iran after five years."],
["وقتی هواپیما در فرودگاه نشست، دلم تند تند می|زد.","When the plane landed at the airport, my heart was racing."],
["مادربزرگم با یک دسته گل~ رز منتظرم بود و تا مرا دید، گریه کرد.","My grandmother was waiting for me with a bouquet of roses, and the moment she saw me, she cried."],
["در آن سفر فهمیدم که زبان فقط وسیله|ای برای حرف زدن نیست؛ پلی است بین~ نسل|ها.","On that trip I realized that language isn't just a tool for talking; it's a bridge between generations."],
["حالا می|خواهم فارسی را بهتر بخوانم تا نامه|هایش را خودم بخوانم.","Now I want to read Persian better, so I can read her letters myself."]
], q:[
["How long had it been since the narrator's last trip?","Five years","One year","Ten years"],
["Why does the narrator want to read Persian better?","To read grandma's letters themselves","For a new job","To pass an exam"]
]},

{id:"t7", lvl:2, fa:"شنبه|ی شلوغ", en:"A busy Saturday", s:[
["شنبه صبح زود بیدار شدم و اول برای خودم چای دم کردم.","On Saturday I woke up early and first made myself some tea."],
["بعد لباس|ها را در ماشین~ لباسشویی گذاشتم و خانه را جارو کردم.","Then I put the clothes in the washing machine and vacuumed the house."],
["ظهر برای ناهار پیاز خرد کردم و در ماهیتابه سرخ کردم.","At noon I chopped onions for lunch and fried them in the frying pan."],
["وقتی داشتم خورش را هم می|زدم، زنگ~ در به صدا درآمد.","While I was stirring the stew, the doorbell rang."],
["همسایه|مان بود؛ آمده بود یک کاسه شکر قرض بگیرد.","It was our neighbor; she had come to borrow a bowl of sugar."]
], q:[
["What did the narrator fry for lunch?","Onions","Fish","Eggs"],
["Who rang the doorbell?","The neighbor","The postman","Their brother"]
]},
{id:"t8", lvl:2, fa:"در داروخانه", en:"At the pharmacy", gl:{"رسید":["resid","receipt"]}, s:[
["از دیشب گلودرد دارم و مدام عطسه می|کنم.","Since last night I've had a sore throat, and I keep sneezing."],
["امروز عصر به داروخانه|ی محله رفتم و در صف ایستادم.","This afternoon I went to the neighborhood pharmacy and stood in line."],
["وقتی نوبتم شد، داروساز پرسید که تب یا حساسیت دارم یا نه.","When my turn came, the pharmacist asked whether I had a fever or an allergy."],
["یک شربت~ سرفه هم خریدم و یک بسته چسب~ زخم، چون دیروز زمین خوردم و آرنجم زخم شد.","I also bought cough syrup and a pack of plasters, because I fell yesterday and scraped my elbow."],
["فروشنده رسید را داد و گفت: «زود خوب شوید!»","The cashier handed me the receipt and said, \"Get well soon!\""]
], q:[
["Why did the narrator buy plasters?","They scraped their elbow","They cut their finger","For a friend"],
["What did the pharmacist ask about?","Fever or allergies","Their age","Their address"]
]},
{id:"t9", lvl:2, fa:"آدم|های خانواده|ی ما", en:"The people in our family", s:[
["عمویم آن|قدر خسیس است که هیچ|وقت چیزی را دور نمی|اندازد.","My uncle is so stingy that he never throws anything away."],
["در عوض، خاله|ام خیلی دست|ودل|باز است و همیشه برای همه سوغاتی می|آورد.","My aunt, on the other hand, is very generous and always brings everyone souvenirs."],
["برادر~ کوچکم کمی لوس و لجباز است، اما خیلی بامزه است.","My little brother is a bit spoiled and stubborn, but he's very funny."],
["مادربزرگم کمی فضول است و همیشه می|خواهد بداند چه کسی به چه کسی زنگ زده است.","My grandmother is a bit nosy and always wants to know who has called whom."],
["با همه|ی این|ها، وقتی دور~ هم جمع می|شویم، خیلی خوش می|گذرد.","Despite all this, whenever we get together, we have a great time."]
], q:[
["Who in the family is generous?","The aunt","The uncle","The grandmother"],
["What is the grandmother like?","A bit nosy","Very shy","Stingy"]
]},

{id:"n1", lvl:3, fa:"هوش مصنوعی در کلاس درس", en:"AI in the classroom", s:[
["در سال|های اخیر، هوش~ مصنوعی به بخش~ مهمی از زندگی~ روزمره تبدیل شده است.","In recent years, AI has become an important part of everyday life."],
["بسیاری از دانش|آموزان برای نوشتن~ تکالیف و یادگیری~ زبان از این فناوری استفاده می|کنند.","Many students use this technology to do homework and learn languages."],
["برخی از معلمان نگران|اند که دانش|آموزان مهارت~ فکر کردن را از دست بدهند.","Some teachers worry that students will lose the ability to think for themselves."],
["در مقابل، گروهی دیگر معتقدند که اگر از آن درست استفاده شود، می|تواند به هر دانش|آموز آموزشی متناسب با نیازهایش بدهد.","Others believe that, used well, it can give every student teaching that fits their needs."],
["به نظر~ کارشناسان، مهم|ترین چالش یافتن~ تعادل~ درست است.","According to experts, the biggest challenge is finding the right balance."]
], q:[
["What are some teachers worried about?","Students losing the ability to think","Computers being too expensive","Students reading too much"],
["According to experts, what's the biggest challenge?","Finding the right balance","Banning the technology","Training more teachers"]
]},
{id:"n2", lvl:3, fa:"گرمایش زمین و آب", en:"Global warming and water", s:[
["دانشمندان می|گویند دمای زمین در صد سال~ گذشته به|طور~ محسوسی افزایش یافته است.","Scientists say the Earth's temperature has risen noticeably over the past hundred years."],
["یکی از پیامدهای این گرمایش، خشکسالی|های طولانی در مناطق~ گرم~ جهان است.","One consequence of this warming is long droughts in the hot regions of the world."],
["در ایران نیز بسیاری از دریاچه|ها و رودخانه|ها کم|آب شده|اند.","In Iran too, many lakes and rivers have lost much of their water."],
["کارشناسان تأکید می|کنند که مصرف~ آب در کشاورزی باید بهتر مدیریت شود.","Experts stress that water use in farming must be managed better."],
["به گفته|ی آن|ها، حفظ~ منابع~ آب برای نسل|های آینده ضروری است.","In their view, protecting water resources is essential for future generations."]
], q:[
["What is one consequence of warming mentioned in the text?","Long droughts","More snow","Cheaper food"],
["Where do experts say water use must be managed better?","In farming","In schools","In homes only"]
]},
{id:"n3", lvl:3, fa:"زبان مادری در مهاجرت", en:"Mother tongue in migration", s:[
["بسیاری از فرزندان~ مهاجران زبان~ مادری خود را می|فهمند، اما خواندن و نوشتن برایشان دشوار است.","Many children of immigrants understand their mother tongue, but reading and writing are hard for them."],
["پژوهشگران به زبان~ این افراد «زبان~ میراثی» می|گویند.","Researchers call these people's language a \"heritage language.\""],
["تحقیقات نشان می|دهد که دوزبانه بودن به رشد~ ذهن و انعطاف~ فکری کمک می|کند.","Research shows that being bilingual helps the mind develop and keeps thinking flexible."],
["با این حال، حفظ~ زبان~ مادری بدون~ تمرین~ منظم آسان نیست.","Still, keeping a mother tongue alive without regular practice isn't easy."],
["خواندن~ روزانه، حتی برای چند دقیقه، می|تواند تفاوت~ بزرگی ایجاد کند.","Reading every day, even for a few minutes, can make a big difference."]
], q:[
["What do many children of immigrants find hard?","Reading and writing","Understanding speech","Making friends"],
["What can make a big difference, according to the text?","Reading a few minutes every day","Watching more TV","Only speaking Persian at home"]
]},
{id:"n4", lvl:3, fa:"تورم چیست؟", en:"What is inflation?", s:[
["تورم یعنی افزایش~ عمومی~ قیمت|ها در طول~ زمان.","Inflation means the general rise in prices over time."],
["وقتی تورم بالا باشد، با همان مقدار پول کالای کمتری می|توان خرید.","When inflation is high, the same amount of money buys fewer goods."],
["این موضوع بیشتر به کسانی آسیب می|زند که درآمد~ ثابت دارند.","This hurts people with a fixed income the most."],
["بانک|های مرکزی معمولاً با بالا بردن~ نرخ~ بهره سعی می|کنند تورم را کنترل کنند.","Central banks usually try to control inflation by raising interest rates."],
["اما این کار ممکن است رشد~ اقتصادی را کند کند.","But this can slow down economic growth."]
], q:[
["Who does inflation hurt the most?","People with a fixed income","Banks","Exporters"],
["What do central banks usually do to fight inflation?","Raise interest rates","Print more money","Lower taxes"]
]},
{id:"n5", lvl:3, fa:"فردوسی و شاهنامه", en:"Ferdowsi and the Shahnameh", s:[
["ابوالقاسم فردوسی حدود~ هزار سال پیش در توس به دنیا آمد.","Abolghasem Ferdowsi was born about a thousand years ago in Tus."],
["او حدود~ سی سال از عمرش را صرف~ سرودن~ شاهنامه کرد.","He spent about thirty years of his life composing the Shahnameh."],
["شاهنامه داستان|های پادشاهان و پهلوانان~ ایران را روایت می|کند.","The Shahnameh tells the stories of Iran's kings and heroes."],
["رستم، مشهورترین پهلوان~ شاهنامه، نماد~ قدرت و وفاداری است.","Rostam, the most famous hero of the Shahnameh, is a symbol of strength and loyalty."],
["بسیاری معتقدند که فردوسی با این کتاب زبان~ فارسی را زنده نگه داشت.","Many believe that with this book Ferdowsi kept the Persian language alive."]
], q:[
["How long did Ferdowsi spend on the Shahnameh?","About thirty years","About three years","His whole childhood"],
["What does Rostam stand for?","Strength and loyalty","Wisdom and poetry","Wealth and power"]
]},
{id:"n6", lvl:3, fa:"ورزش و سلامت روان", en:"Exercise and mental health", s:[
["پژوهش|های جدید نشان می|دهند که ورزش~ منظم فقط برای بدن مفید نیست.","New research shows that regular exercise isn't only good for the body."],
["حتی سی دقیقه پیاده|روی در روز می|تواند اضطراب و افسردگی را کاهش دهد.","Even thirty minutes of walking a day can reduce anxiety and depression."],
["هنگام~ ورزش، مغز موادی ترشح می|کند که حال~ ما را بهتر می|کنند.","During exercise, the brain releases substances that lift our mood."],
["علاوه بر این، ورزش کیفیت~ خواب را بالا می|برد.","On top of that, exercise improves the quality of sleep."],
["پزشکان توصیه می|کنند که ورزش را به بخشی از برنامه|ی روزانه|ی خود تبدیل کنیم.","Doctors recommend making exercise part of our daily routine."]
], q:[
["How much walking can help, according to the text?","Thirty minutes a day","Three hours a week","Ten minutes a month"],
["Besides mood, what does exercise improve?","Sleep quality","Eyesight","Memory for names"]
]},
{id:"n7", lvl:3, fa:"جایزه|ی نوبل", en:"The Nobel Prize", s:[
["آلفرد نوبل، مخترع~ سوئدی، در قرن~ نوزدهم دینامیت را اختراع کرد.","Alfred Nobel, the Swedish inventor, invented dynamite in the 19th century."],
["او در وصیت|نامه|اش خواست که بیشتر~ ثروتش صرف~ جایزه|هایی برای خدمت به بشریت شود.","In his will, he asked that most of his fortune go to prizes for service to humanity."],
["نخستین جایزه|های نوبل در سال~ ۱۹۰۱ اهدا شد.","The first Nobel Prizes were awarded in 1901."],
["مراسم~ اهدای جایزه هر سال در دهم~ دسامبر در استکهلم برگزار می|شود.","The award ceremony is held in Stockholm every year on December 10."],
["تنها جایزه|ی صلح در اسلو، پایتخت~ نروژ، اهدا می|شود.","Only the Peace Prize is awarded in Oslo, the capital of Norway."]
], q:[
["What did Alfred Nobel invent?","Dynamite","The telephone","The radio"],
["Where is the Peace Prize awarded?","In Oslo","In Stockholm","In Geneva"]
]},

{id:"c1", lvl:4, kind:"poem", fa:"بنی|آدم", en:"Human beings (Saadi)", src:"Saadi, Golestan, 1258. These lines are displayed at the United Nations in New York.", s:[
["بنی|آدم اعضای یک پیکرند / که در آفرینش ز یک گوهرند","Human beings are members of one body, / for in creation they share one essence."],
["چو عضوی به درد آورد روزگار / دگر عضوها را نماند قرار","When time brings pain to one member, / the other members cannot rest."],
["تو کز محنت~ دیگران بی|غمی / نشاید که نامت نهند آدمی","You who feel no grief at the suffering of others / do not deserve to be called human."]
]},
{id:"c2", lvl:4, kind:"poem", fa:"توانا بود هر که دانا بود", en:"Knowledge is power (Ferdowsi)", src:"Ferdowsi, Shahnameh, around 1010.", gl:{"بود":["bovad","is (poetic)"]}, s:[
["توانا بود هر که دانا بود / ز دانش دل~ پیر برنا بود","Whoever is wise is powerful; / through knowledge, an old heart stays young."]
]},
{id:"c3", lvl:4, kind:"poem", fa:"نی|نامه", en:"The song of the reed (Rumi)", src:"Rumi, the opening of the Masnavi, 13th century.", s:[
["بشنو این نی چون شکایت می|کند / از جدایی|ها حکایت می|کند","Listen to this reed as it complains, / telling the story of separations."]
]},
{id:"c4", lvl:4, kind:"poem", fa:"یوسف گم|گشته", en:"Don't grieve (Hafez)", src:"Hafez, Divan, 14th century.", s:[
["یوسف~ گم|گشته بازآید به کنعان غم مخور / کلبه|ی احزان شود روزی گلستان غم مخور","Lost Joseph will return to Canaan, do not grieve; / the hut of sorrows will one day become a rose garden, do not grieve."]
]}
];

"use strict";
// ================= data prep =================
const DECKS_ = Z(DECKS).map(d => ({ ...d, w: d.w.map(([fa, fin, en, parts]) => ({ fa, fin, en, parts, deck: d.id })) }));
const POEMS_ = Z(POEMS), ROOTS_ = Z(ROOTS), TEXTS_ = Z(TEXTS), SPELL_ = Z(SPELL), HOMO_ = Z(HOMO), PROV_ = Z(PROV), PARTS_ = Z(PARTS), CATS_ = Z(SPELL_CATS);
const { LX, WORD } = buildLexicon(DECKS_, Z(LEX));
const DECK = {}; DECKS_.forEach(d => DECK[d.id] = d);
const ALLW = DECKS_.flatMap(d => d.w);
const KNOWN = new Set(LX.keys());
const ROOT_OF = {}; ROOTS_.forEach(f => f[2].forEach(x => { ROOT_OF[NORM(x[0])] = f; }));
function rootHTML(fa) {
  const f = ROOT_OF[NORM(fa)];
  if (f) { const sib = f[2].filter(x => NORM(x[0]) !== NORM(fa)).slice(0, 4);
    return `<div class="rootline">Arabic root <span class="fa root">${esc(f[0])}</span> (${esc(f[1])}). Same letters in ${sib.map(x => `<span class="fa">${esc(x[0])}</span> (${esc(x[2])})`).join(", ")}.</div>`; }
  if (["صد", "شصت"].includes(fa)) return "";
  const ch = [...fa].find(c => "ثحصضطظع".includes(c));
  if (ch) return `<div class="rootline"><span class="fa">${ch}</span> is a sign this word comes from Arabic.</div>`;
  if (fa.includes("ق")) return `<div class="rootline"><span class="fa">ق</span> usually means an Arabic or Turkish word.</div>`;
  return "";
}
const ovFor = t => { const o = {}; if (t.gl) for (const k in t.gl) o[NORM(k)] = { fa: k, fin: t.gl[k][0], en: t.gl[k][1] }; return o; };

const fmtSecs = s => s < 60 ? s.toFixed(0) + "s" : Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
const topScroll = () => { $("#sheet").scrollTop = 0; };

// ----- word sessions -----
function startSession(kind, opt = {}) {
  let q = [], title = "";
  if (kind === "learn") {
    const d = DECK[opt.deck] || currentDeck(); S.deck = d.id; save();
    const fresh = d.w.filter(w => !seen(w.fa));
    if (!fresh.length) { toast("You've started every word in this deck. Pick another in Words."); return; }
    const n = opt.extra || Math.max(0, S.set.nw - S.day.nw);
    if (n <= 0) { DS = { id: d.id }; openSheet("limit", "New words"); return; }
    q = fresh.slice(0, n).map(w => ({ fa: w.fa, t: "read", n: 0, learn: true })); title = "New: " + d.en;
  } else if (kind === "review") {
    const due = dueList(); if (!due.length) { toast("Nothing to review right now. Nice."); return; }
    q = due.slice(0, 40).map(fa => ({ fa, t: typeFor(fa), n: 0 })); title = "Review";
  } else if (kind === "deck") {
    const d = DECK[opt.deck], pool = d.w.filter(w => seen(w.fa));
    if (!pool.length) { toast("Learn a few words from this deck first."); return; }
    q = shuffle(pool).slice(0, 15).map(w => ({ fa: w.fa, t: typeFor(w.fa), n: 0 })); title = "Practice: " + d.en;
  } else if (kind === "my") {
    const pool = S.my.filter(getW); if (!pool.length) { toast("Tap words in the reader to save them here."); return; }
    q = shuffle(pool).slice(0, 20).map(fa => ({ fa, t: seen(fa) ? typeFor(fa) : "read", n: 0, learn: !seen(fa) })); title = "My words";
  } else if (kind === "build") {
    let pool = ALLW.filter(w => seen(w.fa) && buildable(w.fa));
    if (pool.length < 10) pool = ALLW.filter(w => DECK[w.deck].lvl <= 2 && buildable(w.fa));
    q = shuffle(pool).slice(0, 10).map(w => ({ fa: w.fa, t: "build", n: 0 })); title = "Build the word";
  }
  SES = { kind, q, i: 0, right: 0, total: 0, xp: 0, c: null, practice: kind === "deck" || kind === "build", drill: kind === "build" ? "build" : null, logged: false };
  newCard(); if (SHEET) { SHEET.kind = "session"; SHEET.title = title; drawSheet(); topScroll(); } else openSheet("session", title);
}
function newCard() {
  const it = SES.q[SES.i]; if (!it) { SES.c = null; finishSession(); return; }
  const w = getW(it.fa), c = { it, w, stage: 0, done: false };
  if (it.t === "choose") { const mis = misspell(w.fa); const pool = (DECK[w.deck] ? DECK[w.deck].w : ALLW).filter(x => x.fa !== w.fa);
    c.mis = mis; c.opts = shuffle([w.fa, ...(mis ? [mis] : []), ...shuffle(pool).slice(0, mis ? 2 : 3).map(x => x.fa)]); }
  if (it.t === "build") { c.tiles = makeTiles(w.fa); c.built = []; c.target = w.fa.replace(/\u200c/g, ""); }
  SES.c = c;
}
function finishSession() {
  if (SES.logged) return; SES.logged = true; if (SES.total) sfx("done");
  if (SES.drill) { const prev = S.best[SES.drill]; if (prev == null || SES.right > prev) S.best[SES.drill] = SES.right; addXP(0, "drill"); }
  save();
}
SHEETS.session = () => {
  if (!SES.c) return summaryHTML("+" + SES.xp + " XP", SES.drill ? `${SES.right} of ${SES.total} spelled right.` : `${SES.total} cards, ${SES.right} answered right.`,
    !SES.drill && dueList().length ? `<button class="btn primary full" data-act="startReview">Review ${dueList().length} due words</button>` : "");
  const it = SES.c.it, pct = SES.i / SES.q.length * 100;
  return `<div class="progress"><i style="width:${pct}%"></i></div>` + (it.t === "read" ? cardRead() : it.t === "choose" ? cardChoose() : cardBuild());
};
function summaryHTML(big, line, extra) {

}
function cardRead() {

  <div class="slot ${c.done ? (c.right ? "ok" : "bad") : ""}" aria-live="polite">${built ? esc(built) : `<span class="muted small" style="font-family:Lexend,sans-serif;font-weight:400">Tap the letters in order</span>`}</div>
  ${c.done ? `<div class="fb ${c.right ? "good" : "badc"}">${c.right ? "Perfect spelling." : `The right spelling is <span class="fa" style="font-weight:800;font-size:1.3em">${esc(w.fa)}</span>`}</div>${rootHTML(w.fa)}
    <div class="btn-row"><button class="btn primary" data-act="cardgo">Next</button></div>`
  : `<div class="tiles">${c.tiles.map((t, i) => `<button class="tile ${c.built.includes(i) ? "used" : ""}" data-act="tile" data-i="${i}" ${c.built.includes(i) ? "disabled" : ""}>${esc(t.c)}</button>`).join("")}</div>
    <div class="btn-row"><button class="btn" data-act="undo">Undo</button><button class="btn" data-act="clear">Clear</button><button class="btn quiet" data-act="giveup">Show me</button></div>`}`;
}
function rateCard(q) {
  const c = SES.c, fa = c.it.fa, first = !seen(fa);
  if (!SES.practice) grade(fa, q);
  const xp = [1, 2, 3][q] + (first && !SES.practice ? 2 : 0); SES.xp += xp; addXP(xp, "rev"); SES.total++; if (q === 2) SES.right++;
  if (q < 2 && c.it.n < 2 && !SES.practice) SES.q.splice(Math.min(SES.i + 4, SES.q.length), 0, { fa, t: "read", n: c.it.n + 1 });
  advance();
}
function autoResult(right) {
  const c = SES.c, fa = c.it.fa; c.done = true; c.right = right; sfx(right ? "right" : "wrong");
  if (!SES.practice) grade(fa, right ? 2 : 0);
  const xp = right ? 4 : 1; SES.xp += xp; addXP(xp, SES.drill ? null : "rev"); SES.total++; if (right) SES.right++;
  else if (c.it.n < 1 && !SES.practice) SES.q.splice(Math.min(SES.i + 4, SES.q.length), 0, { fa, t: "read", n: c.it.n + 1 });
}
function advance() { SES.i++; newCard(); drawSheet(); topScroll(); }
SHEETS.limit = () => {

// ----- reader -----
function openText(id) {
  const t = TEXTS_.find(x => x.id === id); if (!t) return;
  const ov = ovFor(t);
  RD = { t, sents: t.s.map(([fa, en]) => ({ en, parts: fa.split(" / ").map(h => tokenize(LX, h, ov)) })), started: 0, secs: null, wpm: 0, tr: false,
    ans: {}, qopts: (t.q || []).map(q => shuffle([q[1], q[2], q[3]])), finished: false, wc: wordCount(t), sel: null };
  openSheet("reader", t.en);
}
function tokHTML(tk, si, pi, ki) {

SHEETS.guide = () => Z(`<div class="guide">
<div class="panel"><h3>Same sound, different letters</h3><p>Most spelling mistakes come from letter groups that sound identical. The first letter in each group is the common one; the others mostly appear in words borrowed from Arabic.</p></div>
<div class="list">${[["س ص ث", "s", "س is the everyday one. ص and ث show up in Arabic loanwords, plus a few Persian words like صد (hundred) and شصت (sixty)."],
  ["ز ذ ض ظ", "z", "ز is the everyday one. ذ also appears in Persian verbs like گذشتن and پذیرفتن."],
  ["ت ط", "t", "ت is the everyday one. ط is mostly in Arabic loanwords."],
  ["ه ح", "h", "ه is the everyday one. ح is mostly in Arabic loanwords."],
  ["غ ق", "gh", "Both are common and there's no simple rule, so each word has to be learned."],
  ["ا ع ء", "a, e, o", "In everyday speech ع and ء often sound just like a vowel."]].map(r => `<div class="setrow"><div class="letters">${r[0]}</div><p><b>${r[1]}</b>. ${r[2]}</p></div>`).join("")}</div>
<div class="panel" style="margin-top:12px"><h3>Short vowels aren't written</h3><p>Persian writes long vowels (ا و ی) but usually skips short a, e and o. So گل can be gol (flower) or gel (mud), and کرد can be kard (did) or kord (Kurd). You decide from the sentence, which is what the "How is it read?" drill trains.</p></div>
<div class="panel"><h3>The silent و</h3><p>After خ, a و often isn't pronounced: خواهر is khahar, خواب is khab, خواندن is khandan. In خود and خوش the و is a normal o.</p></div>
<div class="panel"><h3>Ezafe, the invisible -e</h3><p>The -e that links words (ketab-e man, my book) is normally not written. The reader can show it as a small mark: کتابِ من. After a vowel it becomes a written ی: خانه|ی ما (khane-ye ma). Turn the hints off in Settings once you can hear it in your head.</p></div>
<h2 style="margin-top:26px">Arabic loanwords</h2>
<div class="panel"><h3>Why they matter</h3><p>A large share of Persian vocabulary comes from Arabic, especially formal, news and religious words. Most tricky spellings live in these words, so spotting them tells you where to be careful.</p></div>
<div class="panel"><h3>How to spot them</h3>
<p><b>The letters.</b> <span class="fa">ث ح ص ض ط ظ ع</span> appear almost only in Arabic words. <span class="fa">ق</span> usually means an Arabic or Turkish word.</p>
<p><b>The Persian-only letters.</b> <span class="fa">پ چ ژ گ</span> don't exist in Arabic, so a word with one of them is almost never Arabic.</p>
<p><b>The shapes.</b> Arabic words are built from a three-letter root poured into fixed molds:</p>
<div class="molds">${[["مـ at the start","معلم، مدرسه، مسافر، منظره"],["تـ ... یـ","تعلیم، تصمیم، تغییر، تحقیق"],["استـ at the start","استقلال، استفاده"],["اِ ... تـ ... ا","انتظار، اعتماد، اختلاف، اقتصاد"],["ـیت at the end","هویت، مسئولیت، موفقیت"],["ـات plurals","انتخابات، صادرات، تحقیقات"],["Broken plurals","اخبار (خبر)، افراد (فرد)، منابع (منبع)"],["ـاً at the end","معمولاً، حتماً"]].map(m => `<div class="mold"><span>${m[0]}</span><span class="fa">${m[1]}</span></div>`).join("")}</div>
<p style="margin-top:10px"><b>The verbs.</b> Almost every simple Persian verb is native: رفتن، خوردن، نوشتن. Arabic words come in through compound verbs like استفاده کردن and تصمیم گرفتن.</p></div>
<div class="panel"><h3>How it helps your spelling</h3>
<p><b>Native Persian word?</b> The s, z, t and h sounds are almost always the plain letters <span class="fa">س ز ت ه</span>. Exceptions are rare: صد, شصت, and ذ in a few verbs like گذشتن and پذیرفتن.</p>
<p><b>The gh sound?</b> Native words usually use <span class="fa">غ</span>: مرغ، باغ، چراغ، دروغ. <span class="fa">ق</span> mostly shows up in Arabic and Turkish loans.</p>
<p><b>Arabic word?</b> Its root letters never change. Learn one word in the family and you can spell the rest: علم، معلم، تعلیم all keep their ع. The word cards show these families as you study.</p>
<button class="btn primary full" style="margin-top:6px" data-act="openRoots">Explore ${ROOTS_.length} root families</button></div>
<h2 style="margin-top:26px">More script tips</h2>
<div class="panel"><h3>The half-space</h3><p>Persian keeps some word parts close but unjoined with a half-space: می|روم, کتاب|ها, بزرگ|تر. It's why می and ها look slightly detached from the word.</p></div></div>`);

  return `<h1>Type</h1><p class="sub">Get quick and accurate on a Persian phone keyboard.</p>

    ${sparkSVG(last.map(r => r.cpm)) || `<p class="muted small" style="margin:8px 0 0">Finish two copy rounds to see your trend.</p>`}
    ${lh ? `<p class="muted small" style="margin:6px 0 0">Letter hunt best: ${lh} letters per minute.</p>` : ""}</div>
  <h2>Practice</h2>
  <div class="list">${Object.keys(TMODES).map(k => { const m = TMODES[k], b = S.best["ty_" + k];
    return `<button class="row" data-act="typeStart" data-id="${k}"><span class="tag">${esc(m.fa)}</span><span><div class="t1">${m.t}</div><div class="t2">${m.d}</div></span><span class="go">${b ? b + "/min" : "Start"}</span></button>`; }).join("")}</div>
  <h2>Set up a Persian keyboard</h2>
  <div class="panel small guide">
    <p><b>iPhone:</b> Settings, then General, then Keyboard, then Keyboards, then Add New Keyboard, and pick Persian. Tap the globe key to switch.</p>
    <p><b>Android (Gboard):</b> open Gboard settings, then Languages, then Add keyboard, and pick Persian (فارسی). Use the globe or the space bar to switch.</p>
    <p style="margin-top:10px">Some letters, like <span class="fa">آ</span>, <span class="fa">ئ</span> and <span class="fa">ژ</span>, can hide behind a long-press on a nearby key.</p>
    <p>Half-spaces (as in <span class="fa">${Z("می|خورم")}</span>) are optional here: type one if your keyboard has it, or use a normal space or nothing. Punctuation is optional too.</p>
  </div>`;
}

// ---- init.js ----
applySettings();
render();

</script>
